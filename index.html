<body><div class="material-wrap"><div class="material-head"><div><h1>材料・在庫管理</h1><div class="card-sub">材料マスター・在庫・納品書AI取込</div></div><a class="backlink" href="https://yuubae96-rgb.github.io/order-search-app/factory.html">← 工場アプリ</a></div><div id="materialAuth" class="card auth-inline" style="display:none"></div><div id="materialApp"><div class="summary-materials"><div class="card"><div class="l">登録材料</div><div class="n" id="mSumCount">0</div></div><div class="card"><div class="l">発注アラート</div><div class="n" id="mSumAlert">0</div></div><div class="card"><div class="l">概算在庫金額</div><div class="n" id="mSumValue">0円</div></div></div><div class="material-tabs"><button class="material-tab active" data-tab="list">在庫一覧</button><button class="material-tab" data-tab="delivery">納品書取込</button><button class="material-tab material-register" data-tab="master">材料登録</button><button class="material-tab" data-tab="move">入庫・出庫</button><button class="material-tab" data-tab="history">履歴</button><button class="material-tab" data-tab="stocktake">棚卸し</button></div><section class="material-panel active" id="mp-list"><div class="card"><div class="field"><label>材料検索</label><input id="mSearch" placeholder="材料名・規格・仕入先"></div><div id="mList"></div></div></section>
<section class="material-panel" id="mp-master"><div class="card"><div class="card-title">材料マスター登録</div><div class="auto-note">基本は選ぶだけ。特殊品だけ「その他」を選ぶと自由入力できます。</div><div class="section-title">① 材料を選ぶ</div><div class="material-grid"><div class="field"><label>大分類</label><select id="mm_category"></select></div><div class="field"><label>材料</label><select id="mm_material"></select></div><div class="field optional-custom" id="customMaterialWrap"><label>その他の材料名</label><input id="mm_name_custom"></div><div class="field"><label>規格・グレード</label><select id="mm_spec"></select></div><div class="field optional-custom" id="customSpecWrap"><label>その他の規格</label><input id="mm_spec_custom"></div><div class="field"><label>厚み</label><select id="mm_thickness"></select></div><div class="field optional-custom" id="customThicknessWrap"><label>その他の厚み mm</label><input type="number" step="any" id="mm_thickness_custom"></div><div class="field"><label>色・地色</label><select id="mm_color"></select></div></div><div class="section-title">② 表面・粘着・ラミネート</div><div class="material-grid"><div class="field"><label>表面処理・外観</label><select id="mm_surface"></select></div><div class="field"><label>粘着</label><select id="mm_adhesive"></select></div><div class="field"><label>ラミネート</label><select id="mm_laminate"></select></div></div><div class="section-title">③ 購入・在庫情報</div><div class="material-grid"><div class="field"><label>購入サイズ・形態</label><select id="mm_purchase_form"></select></div><div class="field optional-custom" id="customPurchaseWrap"><label>その他の購入形態</label><input id="mm_purchase_custom"></div><div class="field"><label>在庫単位</label><select id="mm_stock_unit"><option value="">選択してください</option><option value="枚">枚</option><option value="巻">巻</option><option value="缶">缶</option><option value="kg">kg</option><option value="個">個</option><option value="㎡">㎡（平方メートル）</option></select></div><div class="field"><label>1単位重量 kg</label><input type="number" step="any" id="mm_weight"></div><div class="field"><label>主な仕入先</label><input id="mm_supplier"></div><div class="field"><label>保管場所</label><input id="mm_location"></div><div class="field"><label>現在庫（初期登録）</label><input type="number" step="any" id="mm_initial"></div><div class="field"><label>発注点</label><input type="number" step="any" id="mm_reorder"></div><div class="field"><label>現在の仕入価格</label><input type="number" step="any" id="mm_price"></div><div class="field"><label>価格基準</label><select id="mm_price_basis"><option value="stock_unit">1在庫単位あたり</option><option value="kg">1kgあたり</option><option value="purchase_unit">1購入単位あたり</option></select></div><div class="field"><label>価格適用日</label><input type="date" id="mm_price_date"></div></div><div class="field"><label>備考</label><textarea id="mm_notes"></textarea></div><div class="material-actions"><button class="btn btn-primary" id="mm_save">材料を登録</button><button class="btn btn-ghost" id="mm_clear">クリア</button></div></div></section>

<script>/* 外部モジュールが古いキャッシュでも同じタブを増やさないための保険 */(function(){function dedupe(){['delivery','stocktake'].forEach(function(key){var a=[...document.querySelectorAll('.material-tabs .material-tab[data-tab="'+key+'"]')];if(a.length>1)a.slice(1).forEach(function(x){x.remove()})})}dedupe();new MutationObserver(dedupe).observe(document.querySelector('.material-tabs'),{childList:true})})();</script>

<script>(function(){var UNITS=['枚','巻','缶','kg','個','㎡'];function forceUnits(){var s=document.getElementById('mm_stock_unit');if(!s)return;var current=s.value;s.innerHTML='<option value="">選択してください</option>'+UNITS.map(function(v){return '<option value="'+v+'">'+(v==='㎡'?'㎡（平方メートル）':v)+'</option>'}).join('');if(UNITS.includes(current))s.value=current}function start(){forceUnits();var s=document.getElementById('mm_stock_unit');if(s)new MutationObserver(function(){var vals=[...s.options].map(function(o){return o.value});if(vals.length!==UNITS.length+1||!vals.includes('㎡'))setTimeout(forceUnits,0)}).observe(s,{childList:true});['mm_category','mm_material'].forEach(function(id){document.getElementById(id)?.addEventListener('change',function(){setTimeout(forceUnits,0)})})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start()})();</script>
<script>(function(){function labelInfo(row,originalPriceText){var meta=(row.querySelector('.material-meta')?.textContent||'');var sm=meta.match(/(\d+(?:\.\d+)?)\s*[x×X]\s*(\d+(?:\.\d+)?)/);var pm=String(originalPriceText||'').replace(/,/g,'').match(/最新単価\s*(\d+(?:\.\d+)?)円/);if(!sm)return null;return{widthMm:Number(sm[1]),lengthM:Number(sm[2]),price:pm?Number(pm[1]):null}}function fixLabelUnits(){document.querySelectorAll('#mList .material-list-item').forEach(function(row){var name=(row.querySelector('.material-name')?.textContent||'').trim();if(!name.startsWith('シール '))return;var stock=row.querySelector('.material-stock'),price=row.querySelector('.material-price'),meta=row.querySelector('.material-meta'),originalPriceText=price?.textContent||'',info=labelInfo(row,originalPriceText);if(stock)stock.textContent=stock.textContent.replace(/\s*(枚|単位不明)\s*$/,' ㎡');if(price)price.textContent=price.textContent.replace(/\/\s*(枚|単位不明)(?=\s|$)/,'/ ㎡');if(meta){var oldSize=meta.querySelector('.label-size-note');if(info){if(!oldSize){oldSize=document.createElement('div');oldSize.className='label-size-note';oldSize.style.cssText='margin-top:4px;font-weight:800;opacity:1';meta.appendChild(oldSize)}oldSize.textContent='幅 '+info.widthMm+'mm × 長さ '+info.lengthM+'m'}var n=meta.querySelector('.unit-unknown-note');if(!n){n=document.createElement('div');n.className='unit-unknown-note';n.style.cssText='margin-top:4px;font-weight:800;color:#287a3d;opacity:1';meta.appendChild(n)}n.textContent='数量・単価基準：㎡（平方メートル）'}var old=row.querySelector('.area-price-note');if(old)old.remove()})}function run(){fixLabelUnits();setTimeout(fixLabelUnits,300);setTimeout(fixLabelUnits,1000)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();var target=document.getElementById('mList');if(target)new MutationObserver(function(){setTimeout(fixLabelUnits,0)}).observe(target,{childList:true,subtree:true})})();</script>

<script>(function(){
let bulkBusy=false;
function reviewSummary(){const results=document.getElementById('deliveryResults'),bulk=document.getElementById('deliveryBulk');if(!results||!bulk)return;let review=document.getElementById('deliveryReviewSummary');if(!review){review=document.createElement('div');review.id='deliveryReviewSummary';bulk.parentNode.insertBefore(review,bulk.nextSibling)}const bad=[...results.querySelectorAll('.delivery-result')].filter(c=>c.dataset.safe!=='1'||c.classList.contains('uncertain')||c.querySelector('.delivery-warnings'));if(!bad.length){review.innerHTML='';return}review.innerHTML='<div style="margin:10px 0;padding:13px;border:2px solid #f59e0b;border-radius:12px;background:#fff7ed;color:#9a3412;font-weight:800">⚠ 要確認の明細：'+bad.length+'件<br><span style="font-size:12px;font-weight:600">自動登録されません。内容を確認してから各明細の登録ボタンを押してください。</span><br><button type="button" id="jumpReview" style="margin-top:8px;border:1px solid #f59e0b;background:#fff;color:#9a3412;border-radius:8px;padding:8px 12px;font-weight:800">最初の要確認へ</button></div>';document.getElementById('jumpReview').onclick=function(){bad[0].scrollIntoView({behavior:'smooth',block:'center'})}}
async function robustBulk(e){const btn=e.target.closest&&e.target.closest('#deliveryBulk button');if(!btn||bulkBusy)return;e.preventDefault();e.stopImmediatePropagation();const results=document.getElementById('deliveryResults');if(!results)return;const targets=[...results.querySelectorAll('.delivery-result')].filter(c=>c.dataset.safe==='1'&&!c.classList.contains('delivery-done'));if(!targets.length){btn.disabled=false;btn.textContent='登録対象はありません';return}bulkBusy=true;btn.disabled=true;let ok=0,fail=0;for(let i=0;i<targets.length;i++){btn.textContent='登録中 '+(i+1)+'/'+targets.length+'…';const c=targets[i],cb=c.querySelector('.delivery-confirm');if(!cb){fail++;continue}cb.click();const started=Date.now();while(Date.now()-started<45000){if(c.classList.contains('delivery-done'))break;const msg=(c.querySelector('.msg')?.textContent||'');if(msg.includes('エラー'))break;await new Promise(r=>setTimeout(r,150))}if(c.classList.contains('delivery-done'))ok++;else fail++}btn.disabled=false;btn.textContent=fail?'未登録'+fail+'件をもう一度登録':'✓ '+ok+'件を一括登録しました';let st=document.getElementById('deliveryBulkResult');if(!st){st=document.createElement('div');st.id='deliveryBulkResult';st.style.cssText='margin-top:8px;font-weight:800;color:#14532d';btn.parentNode.appendChild(st)}st.textContent='登録結果：✓ '+ok+'件成功'+(fail?'　⚠ '+fail+'件未登録':'');bulkBusy=false;reviewSummary();if(typeof loadAll==='function')setTimeout(()=>loadAll().catch(()=>{}),300)}
document.addEventListener('click',robustBulk,true);function watch(){reviewSummary();const root=document.getElementById('materialApp');if(root)new MutationObserver(()=>setTimeout(reviewSummary,30)).observe(root,{childList:true,subtree:true})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',watch);else watch();
})();</script>
