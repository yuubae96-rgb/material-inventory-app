.material-wrap{max-width:920px;margin:0 auto;padding:18px 14px 90px}.material-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.material-head h1{font-size:22px;margin:0}.material-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.material-actions{display:flex;gap:8px;flex-wrap:wrap}.material-list-item{padding:14px 0;border-bottom:1px solid rgba(0,0,0,.09)}.material-top{display:flex;justify-content:space-between;gap:10px}.material-name{font-weight:900;font-size:16px}.material-meta{font-size:12px;opacity:.7;line-height:1.6;margin-top:4px}.material-stock{font-weight:900;font-size:19px;white-space:nowrap}.material-alert{color:#c62828}.material-price{font-weight:800;margin-top:5px}.material-note{font-size:12px;opacity:.7}.material-tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin-bottom:12px}.material-tab{white-space:nowrap;border:1px solid #d1d5db;background:#262b31;color:#fff;border-radius:999px;padding:9px 13px;font-weight:700}.material-tab.active{background:#fff;color:#16191d}.material-tab.material-register{background:#22a559;color:#fff;border-color:#22a559}.material-tab.material-register.active{background:#168447;color:#fff;border-color:#168447}.mini-badge{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:3px 7px;background:#383f47;color:#fff}.mini-badge.alert{background:#6b2525;color:#ffd4d4}.history-row{display:grid;grid-template-columns:90px 65px 1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.08);font-size:13px}.summary-materials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.summary-materials .card{padding:14px}.summary-materials .n{font-size:24px;font-weight:900}.summary-materials .l{font-size:11px;opacity:.65}.auth-inline{padding:24px;text-align:center}.backlink{color:#2563eb;text-decoration:none;font-weight:700}.auto-note{font-size:12px;opacity:.7;margin-top:-5px}.optional-custom{display:none}.optional-custom.show{display:block}.section-title{font-weight:800;margin:18px 0 8px}.field select{font-size:16px}
@media(max-width:700px){.material-grid{grid-template-columns:1fr}.summary-materials{grid-template-columns:1fr 1fr}.summary-materials .card:last-child{grid-column:1/-1}.history-row{grid-template-columns:78px 55px 1fr}.history-row .hr-qty{grid-column:3}}

<body>
<div class="material-wrap">
  <div class="material-head"><div><h1>材料・在庫管理</h1><div class="card-sub">材料マスター・在庫・納品書AI取込</div></div><a class="backlink" href="https://yuubae96-rgb.github.io/order-search-app/factory.html">← 工場アプリ</a></div>
  <div id="materialAuth" class="card auth-inline" style="display:none"></div>
  <div id="materialApp">
    <div class="summary-materials"><div class="card"><div class="l">登録材料</div><div class="n" id="mSumCount">0</div></div><div class="card"><div class="l">発注アラート</div><div class="n" id="mSumAlert">0</div></div><div class="card"><div class="l">概算在庫金額</div><div class="n" id="mSumValue">0円</div></div></div>
    <div class="material-tabs"><button class="material-tab active" data-tab="list">在庫一覧</button><button class="material-tab material-register" data-tab="master">材料登録</button><button class="material-tab" data-tab="move">入庫・出庫</button><button class="material-tab" data-tab="history">履歴</button></div>
    <section class="material-panel active" id="mp-list"><div class="card"><div class="field"><label>材料検索</label><input id="mSearch" placeholder="材料名・規格・仕入先"></div><div id="mList"></div></div></section>
    <section class="material-panel" id="mp-master"><div class="card"><div class="card-title">材料マスター登録</div><div class="auto-note">基本は選ぶだけ。特殊品だけ「その他」を選ぶと自由入力できます。</div><div class="section-title">① 材料を選ぶ</div><div class="material-grid"><div class="field"><label>大分類</label><select id="mm_category"></select></div><div class="field"><label>材料</label><select id="mm_material"></select></div><div class="field optional-custom" id="customMaterialWrap"><label>その他の材料名</label><input id="mm_name_custom" placeholder="材料名を入力"></div><div class="field"><label>規格・グレード</label><select id="mm_spec"></select></div><div class="field optional-custom" id="customSpecWrap"><label>その他の規格</label><input id="mm_spec_custom" placeholder="規格を入力"></div><div class="field"><label>厚み</label><select id="mm_thickness"></select></div><div class="field optional-custom" id="customThicknessWrap"><label>その他の厚み mm</label><input type="number" step="any" id="mm_thickness_custom"></div><div class="field"><label>色・地色</label><select id="mm_color"></select></div></div><div class="section-title">② 表面・粘着・ラミネート</div><div class="material-grid"><div class="field"><label>表面処理・外観</label><select id="mm_surface"></select></div><div class="field"><label>粘着</label><select id="mm_adhesive"></select></div><div class="field"><label>ラミネート</label><select id="mm_laminate"></select></div></div><div class="section-title">③ 購入・在庫情報</div><div class="material-grid"><div class="field"><label>購入サイズ・形態</label><select id="mm_purchase_form"></select></div><div class="field optional-custom" id="customPurchaseWrap"><label>その他の購入形態</label><input id="mm_purchase_custom" placeholder="例：450mm×100m巻"></div><div class="field"><label>在庫単位</label><select id="mm_stock_unit"></select></div><div class="field"><label>1単位重量 kg</label><input type="number" step="any" id="mm_weight" placeholder="分かる場合だけ"></div><div class="field"><label>主な仕入先</label><input id="mm_supplier"></div><div class="field"><label>保管場所</label><input id="mm_location"></div><div class="field"><label>現在庫（初期登録）</label><input type="number" step="any" id="mm_initial"></div><div class="field"><label>発注点</label><input type="number" step="any" id="mm_reorder"></div><div class="field"><label>現在の仕入価格</label><input type="number" step="any" id="mm_price"></div><div class="field"><label>価格基準</label><select id="mm_price_basis"><option value="stock_unit">1在庫単位あたり</option><option value="kg">1kgあたり</option><option value="purchase_unit">1購入単位あたり</option></select></div><div class="field"><label>価格適用日</label><input type="date" id="mm_price_date"></div></div><div class="field"><label>備考</label><textarea id="mm_notes"></textarea></div><div class="material-actions"><button class="btn btn-primary" id="mm_save">材料を登録</button><button class="btn btn-ghost" id="mm_clear">クリア</button></div></div></section>
    <section class="material-panel" id="mp-move"><div class="card"><div class="card-title">入庫・出庫</div><div class="material-grid"><div class="field"><label>材料</label><select id="mv_material"></select></div><div class="field"><label>区分</label><select id="mv_type"><option value="in">入庫</option><option value="out">出庫</option><option value="adjust">棚卸調整</option></select></div><div class="field"><label>数量</label><input type="number" step="any" id="mv_qty"></div><div class="field"><label>日付</label><input type="date" id="mv_date"></div><div class="field"><label>仕入先・払出先</label><input id="mv_destination" placeholder="第一工場 / ○○商事"></div><div class="field"><label>今回単価（任意）</label><input type="number" step="any" id="mv_price"></div></div><div class="field"><label>メモ</label><textarea id="mv_memo"></textarea></div><button class="btn btn-primary" id="mv_save">登録する</button></div></section>
    <section class="material-panel" id="mp-history"><div class="card"><div class="card-title">入出庫履歴</div><div id="mHistory"></div></div></section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/gh/yuubae96-rgb/order-search-app@28d162512db535b5cfe06d671f15880b42d05e01/materials.js"></script>
<script src="https://cdn.jsdelivr.net/gh/yuubae96-rgb/order-search-app@main/materials-confirm.js?v=20260820-2015"></script>
<script src="https://cdn.jsdelivr.net/gh/yuubae96-rgb/order-search-app@504ef369c6ed2b751b0315c192200f73f4d6f6e1/materials-patch.js"></script>
<script src="https://cdn.jsdelivr.net/gh/yuubae96-rgb/order-search-app@main/delivery-import.js?v=20260820-2015"></script>
<script>
(function(){
  function labelInfo(row, originalPriceText){
    var meta=(row.querySelector('.material-meta')?.textContent||'');
    var sm=meta.match(/(\d+(?:\.\d+)?)\s*[x×X]\s*(\d+(?:\.\d+)?)/);
    var pm=String(originalPriceText||'').replace(/,/g,'').match(/最新単価\s*(\d+(?:\.\d+)?)円/);
    if(!sm) return null;
    return {widthMm:Number(sm[1]),lengthM:Number(sm[2]),price:pm?Number(pm[1]):null};
  }
  function fixLabelUnits(){
    document.querySelectorAll('#mList .material-list-item').forEach(function(row){
      var name=(row.querySelector('.material-name')?.textContent||'').trim();
      if(!name.startsWith('シール ')) return;
      var stock=row.querySelector('.material-stock');
      var price=row.querySelector('.material-price');
      var meta=row.querySelector('.material-meta');
      var originalPriceText=price?.textContent||'';
      var info=labelInfo(row,originalPriceText);
      if(stock) stock.textContent=stock.textContent.replace(/\s*(枚|単位不明)\s*$/,' ㎡');
      if(price) price.textContent=price.textContent.replace(/\/\s*(枚|単位不明)(?=\s|$)/,'/ ㎡');
      if(meta){
        var oldSize=meta.querySelector('.label-size-note');
        if(info){
          if(!oldSize){oldSize=document.createElement('div');oldSize.className='label-size-note';oldSize.style.cssText='margin-top:4px;font-weight:800;opacity:1';meta.appendChild(oldSize);}
          oldSize.textContent='幅 '+info.widthMm+'mm × 長さ '+info.lengthM+'m';
        }
        var n=meta.querySelector('.unit-unknown-note');
        if(!n){n=document.createElement('div');n.className='unit-unknown-note';n.style.cssText='margin-top:4px;font-weight:800;color:#287a3d;opacity:1';meta.appendChild(n);}
        n.textContent='数量・単価基準：㎡（平方メートル）';
      }
      var old=row.querySelector('.area-price-note');
      if(old) old.remove();
    });
  }
  function run(){fixLabelUnits();setTimeout(fixLabelUnits,300);setTimeout(fixLabelUnits,1000);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run); else run();
  var target=document.getElementById('mList');
  if(target) new MutationObserver(function(){setTimeout(fixLabelUnits,0)}).observe(target,{childList:true,subtree:true});
})();
</script>
</body></html>
